name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build universal app and publish
    runs-on: macos-26
    env:
      TAP_REPO: ${{ github.repository_owner }}/homebrew-halalcloud
      TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Toolchain
        run: swift --version

      - name: Test
        run: swift test

      - name: Build universal app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCHS: "arm64 x86_64"
        run: ./scripts/build-app.sh

      - name: Package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          ditto -c -k --sequesterRsrc --keepParent HalalCloud.app "HalalCloud-${VERSION}.zip"
          SHA256="$(shasum -a 256 "HalalCloud-${VERSION}.zip" | awk '{print $1}')"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "SHA-256: ${SHA256}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "dist/HalalCloud-${VERSION}.zip" \
            --title "Halal Cloud ${VERSION}" \
            --generate-notes

      - name: Update Homebrew tap
        if: env.TAP_TOKEN != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          ./scripts/update-cask.sh "${VERSION}" "${SHA256}" tap "${GITHUB_REPOSITORY}"
          cd tap
          git add Casks/halalcloud.rb
          git commit -m "halalcloud ${VERSION}"
          git push
